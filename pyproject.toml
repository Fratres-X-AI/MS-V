[project]
name = "ms-v"
version = "2.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["sim", "models", "analysis", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return"]
files = [
  "sim/engine.py",
  "sim/conops/kill_chain.py",
  "sim/sobol_model.py",
  "models/system/kinematics.py",
  "models/system/envelope.py",
  "models/cloud_physics/burn_model.py",
  "models/cloud_physics/phase2_pipeline.py",
]

[[tool.mypy.overrides]]
module = [
  "sim.engine",
  "sim.conops.kill_chain",
  "models.cloud_physics.phase2_pipeline",
  "models.sensors.fpv_thermal",
]
follow_imports = "skip"
disable_error_code = ["attr-defined", "assignment", "arg-type", "return-value"]
