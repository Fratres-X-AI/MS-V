# MS-V Form Factor — parametric envelope (Tier B digital representation)
# STATUS: Engineering estimate — NOT validated against CAD or range test
# Sources: TM 43-0001-29 baselines, docs/03, KPP-08, trade study v2

disclaimer: LITERATURE-PARAMETER ENGINEERING ESTIMATE — NOT VALIDATION

ms_v:
  mass_g: 850
  filler_mass_g:
    min: 624
    max: 680
  filler_density_g_cm3:
    min: 0.88
    max: 1.05
    reference: bispectral pyrotechnic composite order-of-magnitude
  body:
    material: sheet_steel
    wall_thickness_mm: 2.0
    length_in: 7.1
    diameter_in: 3.1
  fuze:
    type: M201A1-compatible
    stack_height_mm: 28
    outer_diameter_mm: 52
  ports:
    top: 4
    bottom: 1
    port_diameter_mm: 8
    total_emission_area_m2: 0.0012

# Standard inventory reference (TM 43-0001-29)
baseline_reference: AN-M8

pouch:
  # Common MOLLE single/double grenade pouch — literature / vendor envelope (conservative)
  id: molle_grenade_pouch_typical
  inner_width_mm: 90
  inner_depth_mm: 95
  inner_height_mm: 185
  max_recommended_mass_g: 900
  note: MS-V 79 mm dia × 180 mm may fit snug; verify with issued pouch NSN

throw:
  kpp_id: KPP-08
  range_m:
    min: 20
    max: 25
  sim_p50_m: 21.5
  reference_grenade: M18
  reference_range_m: 35

loadout:
  ms_v_per_soldier: [1, 2]
  visual_smoke_per_event: [1, 2]
  ms_v_mass_g: 850
  an_m8_mass_g: 680

cloud_employment:
  screening_area_sqft:
    min: 30
    max: 40
  throw_offset_m:
    min: 0
    max: 4
  typical_n_ms_v: 2
  typical_n_hc: 1
