# MS-V Cloud Physics — Default Parameters (Literature-Bound)
# STATUS: UNVALIDATED sensitivity-study defaults. Not calibrated to MS-V fill.
# Sources: Annex D, FM 3-50, COMBIC/ECBC references, assumption register A-005

grenade:
  mass_g: 850
  filler_mass_g:
    min: 624
    max: 680
    note: "22-24 oz per baseline_grenades.json MS-V_target"
  # MS-V density-optimized sustained burn — slower than AN-M8 HC (3.8-6.2 g/s on 539 g)
  # Upper bound: 680 g / 4.2 g/s = 162 s raw; p10 duration margin after CL-ramp threshold timing
  burn_rate_g_s:
    min: 2.9
    max: 4.2
    reference: "Design trade 1 — sustained thickness; ECBC bispectral fill path"
  yield_factor:
    min: 0.22
    max: 0.52
  overlap_efficiency: 0.85
  n_ports: 5
  emission_area_m2: 0.0012  # approximate total port area; UNVALIDATED

cloud:
  build_up_time_s:
    min: 8
    target: 12
    max: 15
  duration_effective_s:
    min: 90
    target: 120
    max: 150
  screening_area_sqft:
    min: 30
    target: 35
    max: 40
  cloud_depth_m:
    min: 2.0
    max: 4.0
  cl_ramp_exponent: 1.0  # CL ~ t^exp during build-up; 1.0 = linear

# Mass extinction coefficient alpha (m^2/g) — literature ranges for sensitivity
# ECBC bispectral work; HC soot reference ~8.71 m^2/g visible (fire science)
extinction_coefficient_m2_per_g:
  VIS:
    low: 4.0
    mid: 8.0
    high: 12.0
  NIR:
    low: 3.0
    mid: 6.0
    high: 10.0
  MWIR:
    low: 2.0
    mid: 5.0
    high: 9.0

particle:
  diameter_um:
    min: 0.5
    max: 5.0
  settling_velocity_m_s: 0.02  # UNVALIDATED order-of-magnitude

environment:
  wind_speed_mph:
    min: 0
    max: 15
  temperature_c:
    min: -20
    max: 50
  humidity_rh_pct:
    min: 20
    max: 95
  temperature_burn_coupling:
    reference_c: 20.0
    rate_increase_per_c: 0.002  # symmetric: cold slows, heat accelerates (Arrhenius-lite)
  humidity_yield_penalty:
    reference_rh_pct: 50.0
    loss_per_rh_pct: 0.0015

employment:
  n_grenades: [1, 2, 3]
  visual_smoke_factor: 1.3  # multiplier for combined VIS MoE; UNVALIDATED

monte_carlo:
  n_samples: 10000
  seed: 42

profiles:
  local:
    n_samples: 100000
  runpod:
    n_samples: 2000000

moe:
  lock_break_duration_threshold_s: 60
  transmittance_threshold: 0.15  # below = effective obscuration

kpp:
  # Formal acceptance references (Annex B) — sim still samples full 0-15 mph envelope
  build_up_p90_max_s: 15.0
  duration_p10_min_s: 120.0
  area_p10_min_sqft: 30.0
  lock_break_p50_min_s: 60.0

sim:
  physics_tier: phase2  # v4 | phase1b | phase2 (full microphysics stack)
  sensor_model: v6_probabilistic_lock  # v3_scalar | v4_band_integrated | v5_threat_hardened | v6_probabilistic_lock
  assumption_ids:
    - A-001
    - A-002
    - A-003
    - A-004
    - A-005
    - A-006
    - A-009
    - A-013
    - A-017
    - A-019
    - A-021
    - A-022
    - A-023
    - A-024
    - A-025
    - A-026
    - A-027

# Phase 2 — full microphysics stack (see analysis/PHYSICS_IMPLEMENTATION_STATUS.md)
phase1b:
  throw_offset_m:
    min: 0.0
    max: 4.0
  settling_velocity_m_s: 0.02
  hc_grenade_fill_g: 539.0
  hc_yield_factor:
    min: 0.28
    max: 0.48
  hc_alpha_vis:
    low: 6.0
    high: 12.0
  friendly_thermal_max_cl_g_m2: 5.5
  # Edge-of-plume threat geometry (UAS LOS pierces plume cross-section)
  threat_orbit_fraction:
    min: 0.0
    max: 1.05
  wind_plume_shift_max_m: 5.0
  plume_spread_factor: 3.2
  plume_edge_exponent: 1.4
  squad_radial_fraction:
    min: 0.65
    max: 1.05
  hc_plume_width_factor: 1.35
  hc_plume_edge_exponent: 1.6
  edge_radius_fraction: 0.75
  core_radius_fraction: 0.35

# Phase 2 — microphysics, atmosphere, spectral, deployment, layered plumes
phase2:
  microphysics:
    psd:
      log_sigma: 0.45
    particle_density_kg_m3: 1500.0
    hygroscopic_ref_rh: 50.0
    hygroscopic_growth_per_rh: 0.003
    coagulation_ref_rh: 50.0
    coagulation_rate: 0.0012
  cloud_structure:
    vertical_sigma_factor: 0.35
    wind_shear_ref_mph: 15.0
    wind_shear_coeff: 0.38
    merge_radius_m: 4.0
    buoyancy_rise_per_g_s: 0.35
  atmosphere:
    extinction_ref_rh: 50.0
    extinction_boost_per_rh: 0.0018
    washout:
      washout_rh_threshold: 88.0
      washout_probability_at_max_rh: 0.12
      duration_factor_when_active: 0.72
    stability:
      unstable_dilution: 0.88
      stable_trapping: 1.06
  spectral:
    mie_d_ref_um: 2.0
    multiple_scatter_onset_cl: 8.0
    multiple_scatter_max_boost: 0.18
  burn_dynamics:
    ignition_boost: 1.35
    tail_reduction: 0.72
    ignition_fraction: 0.08
    tail_fraction: 0.15
    ignition_delay_s: 0.4
    post_burn_dissipate_boost: 0.35
  deployment:
    throw_range_m:
      min: 18.0
      max: 25.0
    lateral_dispersion:
      lateral_error_fraction: 0.12
    fuze_delay_s:
      min: 0.7
      max: 2.0
    posture_height_m:
      min: 0.3
      max: 1.4
  diurnal:
    reference_c: 20.0
    contrast_scale_per_c: 0.004
  model_form:
    # Structural uncertainty — alternative ramp exponents sampled per draw
    ramp_exponent:
      min: 0.85
      max: 1.15

# Reproduce harness locks legacy v4 metrics
reproduce:
  physics_tier: v4
  sensor_model: v4_band_integrated
