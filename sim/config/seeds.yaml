  - { job_id: convergence_seed_2027_g3_n2000000, label: convergence_seed_2027_g3, seed: 2027, n_samples: 2000000, n_grenades: 3, category: convergence }
  - { job_id: convergence_seed_4099_g3_n2000000, label: convergence_seed_4099_g3, seed: 4099, n_samples: 2000000, n_grenades: 3, category: convergence }
  - { job_id: convergence_seed_8191_g3_n2000000, label: convergence_seed_8191_g3, seed: 8191, n_samples: 2000000, n_grenades: 3, category: convergence }

  # --- 2M temperature sweep ---
  - { job_id: sweep_temp_cold_g3_n2000000, label: sweep_temp_cold_g3, seed: 680, n_samples: 2000000, n_grenades: 3, category: sweep_temperature, temp_c: [-20, 0] }
