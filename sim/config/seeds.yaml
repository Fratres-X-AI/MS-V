  - { job_id: sweep_burn_hi_3.6_g3_n2000000, label: sweep_burn_hi_3.6_g3, seed: 536, n_samples: 2000000, n_grenades: 3, category: sweep_burn_rate, burn_max_g_s: 3.6 }
  - { job_id: sweep_burn_hi_3.8_g3_n2000000, label: sweep_burn_hi_3.8_g3, seed: 538, n_samples: 2000000, n_grenades: 3, category: sweep_burn_rate, burn_max_g_s: 3.8 }
  - { job_id: sweep_burn_hi_4.0_g3_n2000000, label: sweep_burn_hi_4.0_g3, seed: 540, n_samples: 2000000, n_grenades: 3, category: sweep_burn_rate, burn_max_g_s: 4.0 }
  - { job_id: sweep_burn_hi_4.2_g3_n2000000, label: sweep_burn_hi_4.2_g3, seed: 542, n_samples: 2000000, n_grenades: 3, category: sweep_burn_rate, burn_max_g_s: 4.2 }
  - { job_id: sweep_burn_hi_4.4_g3_n2000000, label: sweep_burn_hi_4.4_g3, seed: 544, n_samples: 2000000, n_grenades: 3, category: sweep_burn_rate, burn_max_g_s: 4.4 }

  # --- 2M alpha sweep ---
  - { job_id: sweep_alpha_tight_g3_n2000000, label: sweep_alpha_tight_g3, seed: 601, n_samples: 2000000, n_grenades: 3, category: sweep_alpha }
  - { job_id: sweep_alpha_wide_g3_n2000000, label: sweep_alpha_wide_g3, seed: 602, n_samples: 2000000, n_grenades: 3, category: sweep_alpha }
  - { job_id: sweep_alpha_pessimistic_g3_n2000000, label: sweep_alpha_pessimistic_g3, seed: 603, n_samples: 2000000, n_grenades: 3, category: sweep_alpha }

