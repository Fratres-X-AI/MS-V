name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ms-v-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-lock.txt ruff pytest

      - name: Lint (ruff)
        run: ruff check sim models analysis tests

      - name: Unit tests
        run: pytest tests/ -q

      - name: Reproducibility harness
        run: python -m sim.reproduce

      - name: Run local simulation suite (100k)
        run: python sim/run_suite_local.py

      - name: Adversarial stress validation
        run: python sim/validate_stress.py

      - name: Quick mega-suite smoke (38 jobs)
        run: python sim/run_mega_suite.py --quick --workers 2 --out analysis/results/mega_suite_quick

      - name: Sobol global sensitivity (quick)
        run: python sim/run_sobol.py --quick --workers 2

      - name: Sobol report
        run: python analysis/summarize_sobol.py

      - name: Form factor assets (Tier B)
        run: python analysis/generate_form_factor_assets.py

      - name: Verification matrix (from committed 140M manifest)
        run: python analysis/generate_verification_matrix.py

      - name: Partner validation template JSON
        run: python -c "import json; json.load(open('data/partner_validation_results.template.json'))"
