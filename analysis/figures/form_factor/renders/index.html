<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; background: #1a1a1a; color: #eee; }

    h2 { font-size: 1.05rem; color: #cbd5e0; margin-top: 2rem; }
    p.note { color: #a0aec0; font-size: 0.9rem; }
